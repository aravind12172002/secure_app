name: Security pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned runtime and security tools
        run: python -m pip install --requirement requirements.lock

      - name: Run application and security checks
        run: python scripts/security_pipeline.py

      - name: Upload machine-readable scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: reports/
          if-no-files-found: warn
